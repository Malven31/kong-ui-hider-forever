# Packages the addon and uploads it to CurseForge whenever a tag is pushed (scripts/release.ps1 makes the
# tag). A tag containing "beta" or "alpha" is uploaded as a beta or alpha file, any other tag as a release.
#
# Running the workflow by hand (Actions tab > Package > Run workflow) is a dry run: it builds the zip
# without uploading it and attaches it to the run, to check what players would get.
#
# Needs the repository secret CF_API_TOKEN: a CurseForge API token from
# https://authors.curseforge.com/#/settings/api-tokens
name: Package

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository with its full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The changelog of the CurseForge file: this version's CHANGELOG.md section only (the newest one on
      # a dry run). Fails when the section is missing or empty.
      - name: Write this version's changelog
        run: bash scripts/release-notes.sh "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      # Without a token the packager skips the CurseForge upload silently and the run still succeeds.
      - name: Check that the CurseForge token is set
        if: github.event_name == 'push'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::The CF_API_TOKEN secret is missing, so nothing would be uploaded to CurseForge. Add it under Settings > Secrets and variables > Actions > Repository secrets, then re-run this workflow."
            exit 1
          fi

      - name: Package and upload to CurseForge
        if: github.event_name == 'push'
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Package only (dry run, nothing is uploaded)
        if: github.event_name == 'workflow_dispatch'
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Attach the zip to the run
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .release/*.zip
          # .release starts with a dot, and upload-artifact skips hidden files by default since v4.4.
          include-hidden-files: true
          if-no-files-found: error
